<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="../src/styles/global.css" />
  <link rel="stylesheet" href="../src/styles/home.css" />
</head>

<body data-page-title-key="meta.title.home">
  <div class="app">
    <header class="header">
      <a href="./index.html" class="logo">Hernandes Santos Pereira</a>

      <div class="header-actions">
        <nav class="nav">
          <a href="./index.html" data-i18n="nav.home">Home</a>
          <a href="./professional.html" data-i18n="nav.professional">Professional</a>
          <a href="./projects.html" data-i18n="nav.projects">Projects</a>
          <a href="./contact.html" data-i18n="nav.contact">Contact</a>
        </nav>

        <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch to Brazilian Portuguese"
          data-i18n-aria-label="lang.toggleAria">
          <span class="lang-toggle__flag" aria-hidden="true">🇧🇷</span>
          <span class="lang-toggle__label" data-i18n="lang.toggleLabel">PT-BR</span>
        </button>
      </div>
    </header>

    <main class="hero" id="home">
      <section class="hero-content">
        <h1 class="hero-title">
          <span data-i18n="home.heroTitleLine1">Hello,</span>
          <span data-i18n="home.heroTitleLine2">welcome to My Portfolio!</span>
        </h1>

        <p class="hero-description" data-i18n="home.heroDescription">
          I'm Hernandes, a Software Engineering student at Universidade do
          Estado da Bahia
        </p>

        <p class="hero-text" data-i18n="home.heroText">
          Learn more about me here and feel free to contact me.
        </p>

        <a href="./contact.html" class="hero-button" data-i18n="home.contactButton">Contact</a>
      </section>

      <section class="hero-image">
        <div class="hero-image__portrait">
          <div class="image-glow"></div>
          <img src="/profile-photo.jpg" alt="Portrait of Hernandes Santos Pereira" data-i18n-alt="home.portraitAlt" />
        </div>
        <div id="cube-component-root"></div>
      </section>
    </main>
  </div>
  <script type="module" src="../src/main.js"></script>
</body>

</html>
